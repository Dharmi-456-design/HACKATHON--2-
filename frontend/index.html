<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NaturePulse — AI-Powered Nature Relationship Platform</title>
    <meta name="description" content="NaturePulse is an AI-powered ecological discovery platform. Observe native biodiversity, explore local sanctuaries, complete field missions, and connect with urban nature." />
    <meta name="theme-color" content="#0A1610" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Canonical & SEO Meta -->
    <link rel="canonical" href="https://naturepulse.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naturepulse.app/" />
    <meta property="og:title" content="NaturePulse — Reconnect with the Living World" />
    <meta property="og:description" content="Observe, understand, experience, and care for urban biodiversity through AI ecological lens, soundscapes, and community field missions." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1511497584788-87676104235f?w=1200&q=80" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NaturePulse — Reconnect with the Living World" />
    <meta name="twitter:description" content="AI-powered nature relationship platform and biodiversity tracking." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1511497584788-87676104235f?w=1200&q=80" />

    <!-- Google Fonts Non-blocking Preconnect & Stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" />
    </noscript>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NaturePulse",
        "url": "https://naturepulse.app",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "description": "AI-powered nature relationship and urban biodiversity tracking platform.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Theme Initialization Script (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('np-theme');
          var isDark = t === 'dark' || !t;
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
